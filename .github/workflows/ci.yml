name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end (Playwright on the Pages runtime)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hookah-pookah.pages.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Trigger the Pages build of main
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "CLOUDFLARE_DEPLOY_HOOK secret is missing"; exit 1; }
          curl -fsS -X POST "$HOOK" | grep -Eq '"success": *true'
      - name: Wait until production serves this commit's bundle
        run: |
          expected=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "Expecting $expected"
          for i in $(seq 1 50); do
            live=$(curl -fsS "https://hookah-pookah.pages.dev/holdem?cachebust=$GITHUB_SHA-$i" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            if [ "$live" = "$expected" ]; then echo "Live on $live"; exit 0; fi
            sleep 15
          done
          echo "Production still serves ${live:-nothing}"; exit 1
      - name: Smoke test production
        run: |
          for path in / /holdem /short-deck /plo /plo5 /about /contact /privacy /robots.txt /sitemap.xml /llms.txt /og.png /index.md; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://hookah-pookah.pages.dev$path")
            echo "$path $code"; test "$code" = 200
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://hookah-pookah.pages.dev/some-path-that-does-not-exist")
          echo "missing $code"; test "$code" = 404
          md_type=$(curl -sS -D - -o /tmp/hp-md.txt -H 'Accept: text/markdown' "https://hookah-pookah.pages.dev/" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2; exit}')
          echo "markdown content-type: $md_type"
          echo "$md_type" | grep -qi 'text/markdown'
          test "$(wc -c </tmp/hp-md.txt)" -gt 200
          vary=$(curl -sS -I -H 'Accept: text/markdown' "https://hookah-pookah.pages.dev/" | tr -d '\r' | awk -F': ' 'tolower($1)=="vary"{print $2; exit}')
          echo "vary: $vary"
          echo "$vary" | grep -qi Accept
